<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<!-- viewport: hace que la página se vea bien en celulares -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alerta de heladas | Chaskayni</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div class="tejido" aria-hidden="true"></div>
<!-- ENCABEZADO: en PHP pasa a includes/header.php; en Laravel, a resources/views/layouts/app.blade.php -->
<header class="barra">
  <a class="marca" href="index.html">Chaskayni</a>
  <!-- <nav>: menú de navegación. aria-label lo describe para lectores de pantalla. -->
<nav id="menu" aria-label="Principal">
    <a href="index.html">Inicio</a><a href="mercado.html">Mercado</a><a href="heladas.html">Heladas</a><a href="riesgo.html">Riesgo urbano</a>
  </nav>
  <button id="btnSesion" class="btn sec" type="button">Ingresar</button>
</header>
<!-- <main>: contenido principal de la página (uno solo). Cambia en cada página. -->
<main>
<h2>Alerta de heladas</h2>
<p>Elige una comunidad e ingresa la temperatura prevista para la madrugada. Si baja de 0 °C, se emite una alerta.</p>
<!-- <form novalidate>: apagamos los mensajes del navegador para usar nuestra validación en JavaScript -->
<form id="formAlerta" class="form" novalidate>
  <label>Comunidad <select name="comunidad" id="selComunidad"></select></label>
  <label>Temperatura prevista (°C) <input name="temp" type="number" step="0.5" required></label>
  <button class="btn" type="submit">Evaluar y emitir alerta</button>
  <p class="error" id="errAlerta" role="alert"></p>
</form>
<ul id="listaAlertas" class="lista"></ul>
</main>
<!-- PIE: en PHP pasa a includes/footer.php; en Laravel, al layout Blade -->
<footer>Chaskayni · Programación Web, Universidad Continental · Mapas: © OpenStreetMap, Leaflet</footer>
<!-- ORDEN IMPORTANTE: utils.js primero (define $, el, Datos), luego auth.js y al final el JS de esta página -->
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/heladas.js"></script>
</body>
</html>
